name: android

# FMLAB Controller per Android: APK firmato (firma fissa, si aggiorna sopra la versione precedente).
on:
  push:
    branches: [main]
    paths: ["android/**", "VERSIONE", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Firma (Secrets del repository se ci sono, altrimenti quella pubblica in android/firma)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/firma.jks"; echo "FMLAB_KEYSTORE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"; echo "FMLAB_KEYSTORE_PASSWORD=$KSP" >> "$GITHUB_ENV"; echo "firma privata"; else echo "firma pubblica"; fi
      - name: Compila l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Verifica APK
        run: |
          A=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$A"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$A" | head -3
          "$BT/aapt" dump badging "$A" | grep -E "package:|application-label:|sdkVersion|targetSdk"
          cp "$A" FMLAB-Controller.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FMLAB-Controller-apk
          path: FMLAB-Controller.apk
      - name: Pubblica (versione numerata + "ultima")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSIONE)
          NOTE=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --target "$GITHUB_SHA" --title "FMLAB Emulator $V" --notes "$NOTE" || true
          gh release edit "v$V" --notes "$NOTE" >/dev/null || true
          gh release upload "v$V" FMLAB-Controller.apk --clobber
          gh release view ultima >/dev/null 2>&1 || gh release create ultima --target "$GITHUB_SHA" --latest --title "FMLAB Emulator (ultima)" --notes "Sempre l'ultima versione. iPhone: LiveContainer → + → Installa dall'URL → https://github.com/${GITHUB_REPOSITORY}/releases/download/ultima/FMLAB-Emulator.ipa · Android: scarica FMLAB-Controller.apk." || true
          gh release upload ultima FMLAB-Controller.apk --clobber
